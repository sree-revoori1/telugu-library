name: Build

# Builds the site and uploads it as an artifact. Runs on a push to main and weekly,
# because Wikisource's texts are edited continuously — a library that never refetches
# slowly drifts away from its sources.
#
# It does not deploy. GitHub Pages requires a public repository on the free plan, and
# this one is private; publishing is a separate step the README describes. The artifact
# is the whole site, so it can be downloaded and dropped on any host.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # telugu-morph is a private repository, so an anonymous clone fails with
      # "could not read Username for 'https://github.com'". Checked out as a sibling
      # with a token instead, and put on PYTHONPATH — no install step needed, since it
      # is pure standard library.
      #
      # ACCESS_TOKEN must be a repository secret: a fine-grained PAT with read access
      # to telugu-morph. The default GITHUB_TOKEN is scoped to *this* repository only
      # and cannot see another private one.
      - name: Check out telugu-morph
        uses: actions/checkout@v4
        with:
          repository: sree-revoori1/telugu-morph
          path: telugu-morph
          token: ${{ secrets.ACCESS_TOKEN }}

      # The corpus is ~4,800 Wikisource pages fetched at a courtesy rate, which takes
      # far longer than a job should. Caching it means only the first run pays, and
      # later runs fetch just what is new.
      - name: Restore the corpus cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/telugu-library
          key: corpus-${{ hashFiles('data/catalogue.json') }}
          restore-keys: corpus-

      - name: Test
        run: python3 tests/test_library.py
        env:
          PYTHONPATH: src:telugu-morph/src

      - name: Build
        run: python3 -m telugu_library.build --all
        env:
          PYTHONPATH: src:telugu-morph/src

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
